<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Report</title>
</head>
<body>
  <h1>Sunrise Public School</h1>

  <table border="1" cellpadding="6">
    <caption>Annual Report Card</caption>
    <thead>
      <tr><th colspan="3" title="Student details">Name: Abhi | Class: 10 | Roll No: 21</th></tr>
      <tr>
        <th rowspan="2" title="Subject name">Subject</th>
        <th colspan="2" title="Marks details">Marks</th>
      </tr>
      <tr>
        <th title="Marks obtained">Obtained</th>
        <th title="Maximum marks">Maximum</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>English</td><td>82</td><td>100</td></tr>
      <tr><td>Mathematics</td><td>91</td><td>100</td></tr>
      <tr><td>Science</td><td>88</td><td>100</td></tr>
      <tr><td>Social Science</td><td>79</td><td>100</td></tr>
      <tr><td>Hindi</td><td>85</td><td>100</td></tr>
    </tbody>
    <tfoot>
      <tr><th title="Sum of all marks">Total</th><td colspan="2">Total marks (text only)</td></tr>
      <tr><th title="Overall percentage">Percentage</th><td colspan="2">Percentage (text only)</td></tr>
    </tfoot>
  </table>
</body>
</html>

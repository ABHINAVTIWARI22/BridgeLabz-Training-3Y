<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dropdown Selection</title>
</head>
<body>
  <h1>Select Your Travel Preferences</h1>

  <form>
    <p>
      <label for="country">Country:</label>
      <select id="country" name="country">
        <option>USA</option>
        <option selected>India</option>
        <option>Japan</option>
      </select>
    </p>

    <p>
      <label for="state">State:</label>
      <select id="state" name="state">
        <option>Rajasthan</option>
        <option selected>Uttar Pradesh</option>
        <option>Kerala</option>
      </select>
    </p>

    <p>
      <label for="city">City:</label>
      <select id="city" name="city">
        <option>Lucknow</option>
        <option selected>Agra</option>
        <option>Varanasi</option>
      </select>
    </p>

    <p>
      <label for="place">Favorite Tourist Place:</label>
      <select id="place" name="place">
        <option selected>Taj Mahal</option>
        <option>Agra Fort</option>
        <option>Fatehpur Sikri</option>
      </select>
    </p>
  </form>

  <!-- Summary of the pre-selected choices -->
  <p>Summary: My favorite tourist place is the Taj Mahal in Agra, Uttar Pradesh, India.</p>
</body>
</html>

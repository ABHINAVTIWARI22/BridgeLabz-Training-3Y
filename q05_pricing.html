<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <link rel="stylesheet" href="q05_pricing.css">
</head>
<body>
  <h1>Choose Your Plan</h1>
  <section class="plans">
    <article class="plan">
      <h2>Basic</h2>
      <ul>
        <li>1 User</li>
        <li>5 GB Storage</li>
      </ul>
      <p class="price">Rs. 199/mo</p>
      <a href="#" class="btn">Buy Now</a>
    </article>

    <article class="plan popular">
      <h2>Standard</h2>
      <ul>
        <li>5 Users</li>
        <li>50 GB Storage</li>
        <li>Email Support</li>
        <li>Monthly Reports</li>
      </ul>
      <p class="price">Rs. 499/mo</p>
      <a href="#" class="btn">Buy Now</a>
    </article>

    <article class="plan">
      <h2>Premium</h2>
      <ul>
        <li>Unlimited Users</li>
        <li>500 GB Storage</li>
        <li>24/7 Support</li>
      </ul>
      <p class="price">Rs. 999/mo</p>
      <a href="#" class="btn">Buy Now</a>
    </article>
  </section>
</body>
</html>
